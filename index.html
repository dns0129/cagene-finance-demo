<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>CA Gene 財務工作台 · 同事試用</title>
  <style>
    :root{color-scheme:light;--ink:#142920;--muted:#456056;--accent:#105e49;--line:#d6e5dc;--white:#fff;--wash:#f2f8f3;--ui:Inter,"PingFang HK","Noto Sans HK",system-ui,sans-serif}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background:#f5f7f4;color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55}
    .frame{max-width:970px;margin:auto;padding:clamp(20px,6vw,72px) clamp(18px,5vw,52px)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:clamp(22px,4vw,42px);font-weight:720;letter-spacing:.03em}
    .brand-mark{display:grid;width:36px;height:36px;place-items:center;background:var(--accent);color:white;border-radius:10px;font-size:14px}
    .hero{position:relative;isolation:isolate;overflow:hidden;padding:clamp(24px,7vw,64px);border-radius:24px;background:#123a30;color:#f6fff8}
    .hero::before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse at 90% 0%,#1f674f,transparent 68%)}
    .hero p{max-width:34em;margin:0 0 24px;color:#d3e9dc}
    h1{margin:0 0 12px;font-size:clamp(30px,6vw,52px);line-height:1.13;letter-spacing:-.045em;text-wrap:balance}
    a{color:var(--accent)}
    .enter{display:inline-flex;min-height:48px;align-items:center;gap:10px;padding:10px 18px;border:1px solid #d7efe1;border-radius:9px;background:#d7efe1;color:#123a30;text-decoration:none;font-weight:750;transition:background-color .18s,box-shadow .18s}
    .enter:hover{background:#fff;box-shadow:0 3px 16px #122b2760}
    a:focus-visible{outline:3px solid #368d69;outline-offset:4px}
    .paths{margin-top:18px;border:1px solid var(--line);border-radius:18px;background:white;overflow:hidden}
    article{display:grid;grid-template-columns:minmax(8rem,1fr) minmax(0,3fr);gap:12px;padding:18px clamp(16px,4vw,30px)}
    article+article{border-top:1px solid var(--line)}
    h2{margin:0;font-size:18px}
    article p,.foot{margin:0;color:var(--muted)}
    .foot{padding:18px 2px 0;font-size:14px}
    @media(max-width:530px){article{grid-template-columns:1fr;gap:4px}.hero{border-radius:17px}.brand{margin-bottom:18px}}
    @media(prefers-reduced-motion:no-preference){.hero,.paths{animation:enter .38s ease-out both}.paths{animation-delay:.07s}@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
  <main class="frame">
    <div class="brand"><span class="brand-mark" aria-hidden="true">CA</span><span>CA Gene</span></div>
    <section class="hero" aria-labelledby="title">
      <h1 id="title">財務工作台</h1>
      <p>用同事提供的演示帳號登入，和團隊一起試行開票、過帳及出糧。</p>
      <a class="enter" href="https://buy-database-killing-leaf.trycloudflare.com/?lang=zh-HK">開啟測試系統 <span aria-hidden="true">↗</span></a>
    </section>
    <section class="paths" aria-label="試用流程">
      <article><h2>開票與過帳</h2><p>銷售提交發票申請。會計可勾選待審批的演示發票，試用 Wonder 核對及批量過帳。</p></article>
      <article><h2>薪酬與出糧</h2><p>HR 發佈工資草稿，員工確認糧單，會計選擇演示銀行扣款，核對後過帳。</p></article>
      <article><h2>管理層查看</h2><p>查看公司帳、銷售開票與收款，以及工資批次與確認狀態。</p></article>
    </section>
    <p class="foot">這是共用演示帳套。請用虛構姓名、發票和金額完成試用。</p>
  </main>
</body>
</html>
